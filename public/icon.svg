<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="badgeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#102A43"/>
      <stop offset="100%" stop-color="#080B10"/>
    </linearGradient>
    <filter id="brandGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#7DD3FC" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Square Container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#badgeGradient)" stroke="#243447" stroke-width="2.5"/>
  <rect x="5.5" y="5.5" width="53" height="53" rx="10.5" fill="none" stroke="#7DD3FC" stroke-opacity="0.15" stroke-width="1.5"/>

  <!-- Official ONE STORE Cyan Brand Mark -->
  <g filter="url(#brandGlow)" stroke="#7DD3FC" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M20 12 L14 20 L14 48 A4 4 0 0 0 18 52 L46 52 A4 4 0 0 0 50 48 L50 20 L44 12 Z"/>
